# CI Workflow for Extracted Azazael Repo (metadata + audit scripts)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Audit Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run accessibility audit
        run: python tools/audit_accessibility.py .
      - name: Run inclusion audit
        run: python tools/audit_inclusion.py .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff black mypy
      - name: Run ruff (syntax + undefined names only)
        run: ruff check --select E4,E7,E9,F .
      - name: Run black --check
        run: black --check .
      - name: Run mypy
        run: mypy --ignore-missing-imports . 2>/dev/null || true

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install pip-audit safety
      - name: Run pip-audit
        run: pip-audit || true
      - name: Run safety
        run: safety check || true