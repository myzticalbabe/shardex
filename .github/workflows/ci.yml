# CI Workflow for Extracted Azazael Repo (metadata + audit scripts)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Audit Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run accessibility audit (non-failing)
        run: python tools/audit_accessibility.py --path . --fail-on high || true
      - name: Run inclusion audit (non-failing)
        run: python tools/audit_inclusion.py --path . --fail-on high || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff black mypy
      - name: Run ruff (syntax + undefined names only, non-failing)
        run: ruff check --select E4,E7,E9,F . || true
      - name: Run black --check (non-failing)
        run: black --check . || true
      - name: Run mypy (non-failing)
        run: mypy --ignore-missing-imports . 2>/dev/null || true

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install pip-audit
      - name: Run pip-audit (non-failing)
        run: pip-audit || true