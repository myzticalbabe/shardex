name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi
      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            pip install basedpyright && basedpyright --version
          fi
